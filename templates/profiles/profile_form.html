{% extends "components/simple_form.html" %}
{% block content %}
<div class="page"><div class="narrow">
  <div class="page-head"><h1>{{ title }}</h1></div>
  <div class="card">
    {% if intro %}<p class="muted">{{ intro }}</p>{% endif %}
    <form method="post" enctype="multipart/form-data" novalidate data-loading>
      {% csrf_token %}{% include "components/form_fields.html" %}
      <div class="form-actions"><button class="btn btn-primary" type="submit">Зберегти</button><a class="btn btn-secondary" href="{% url 'profiles:view' %}">Скасувати</a></div>
    </form>
  </div>
</div></div>
{% endblock %}
