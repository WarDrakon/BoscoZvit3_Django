{% extends "base.html" %}
{% block title %}{{ title }} — Roommate{% endblock %}
{% block content %}
<div class="page"><div class="narrow">
  <div class="page-head"><h1>{{ title }}</h1></div>
  <div class="card">
    {% if intro %}<p class="muted">{{ intro }}</p>{% endif %}
    <form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %} novalidate data-loading>
      {% csrf_token %}
      {% include "components/form_fields.html" %}
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">{{ submit|default:"Зберегти" }}</button>
        <a class="btn btn-secondary" href="{{ cancel_url|default:'/cabinet/' }}">Скасувати</a>
      </div>
    </form>
  </div>
</div></div>
{% endblock %}
