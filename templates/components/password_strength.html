<div class="password-strength" id="ps-{{ field.auto_id }}">
  <div class="field{% if field.field.widget.input_type == 'checkbox' %} field-check{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="muted" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
  </div>
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {{ field.errors }}
  <div class="strength-meter" role="region" aria-label="Надійність пароля" aria-labelledby="ps-text-{{ field.auto_id }}">
    <div class="strength-track"><div class="strength-fill" id="ps-fill-{{ field.auto_id }}"></div></div>
    <span class="strength-text" id="ps-text-{{ field.auto_id }}">Введіть пароль</span>
  </div>
  <ul class="strength-hints" id="ps-hints-{{ field.auto_id }}">
    <li class="hint hint-len" id="ps-hint-len-{{ field.auto_id }}">&#10007; Щонайменше 8 символів</li>
    <li class="hint hint-digit" id="ps-hint-digit-{{ field.auto_id }}">&#10007; Цифри</li>
    <li class="hint hint-lower" id="ps-hint-lower-{{ field.auto_id }}">&#10007; Малі літери</li>
    <li class="hint hint-upper" id="ps-hint-upper-{{ field.auto_id }}">&#10007; Великі літери</li>
    <li class="hint hint-symbol" id="ps-hint-symbol-{{ field.auto_id }}">&#10007; Символи</li>
  </ul>
  <button type="button" class="btn-toggle-password" data-target="{{ field.id_for_label }}" aria-pressed="false" aria-label="Показати пароль">
    {% include "components/icon.html" with name="x" %}<span class="toggle-text">Показати</span>
  </button>
</div>
